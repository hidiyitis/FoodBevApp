spring.config.import=optional:file:.env[.properties]

spring.application.name=FoodBevApp
# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/tubes
spring.datasource.username=postgres
spring.datasource.password=user
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Thymeleaf Configuration
# Spring Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.cache=false

# File Upload Configuration
app.upload.dir=uploads
app.upload.base-url=http://localhost:8081/uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB


# Spring Static Resources
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Debug
logging.level.org.springframework.web=DEBUG
logging.level.org.thymeleaf=DEBUG

# Server Configuration
server.port=8081
app.base-url=http://localhost:8081

# Midtrans Configuration (Sandbox)
midtrans.server-key=${MIDTRANS_SERVER_KEY}
midtrans.client-key=${MIDTRANS_CLIENT_KEY}
midtrans.is-production=false
midtrans.snap-url=https://app.sandbox.midtrans.com/snap/v1/transactions
midtrans.api-url=https://api.sandbox.midtrans.com/v2