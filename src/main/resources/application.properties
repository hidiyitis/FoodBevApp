spring.config.import=optional:file:.env[.properties]

spring.application.name=FoodBevApp
# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Thymeleaf Configuration
# Spring Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.cache=false

# File Upload Configuration
app.upload.dir=uploads
app.upload.base-url=${APP_BASE_URL}/uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB


# Spring Static Resources
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Debug
logging.level.org.springframework.web=DEBUG
logging.level.org.thymeleaf=DEBUG

# Server Configuration
server.port=${SERVER_PORT}
app.base-url=${APP_BASE_URL}

# Midtrans Configuration (Sandbox)
midtrans.server-key=${MIDTRANS_SERVER_KEY}
midtrans.client-key=${MIDTRANS_CLIENT_KEY}
midtrans.is-production=false
midtrans.snap-url=https://app.sandbox.midtrans.com/snap/v1/transactions
midtrans.api-url=https://api.sandbox.midtrans.com/v2

# Default User Configuration (for initial setup)
# These should be set via environment variables for security
app.default.admin.email=${DEFAULT_ADMIN_EMAIL:admin@foodbev.com}
app.default.admin.password=${DEFAULT_ADMIN_PASSWORD:}
app.default.user.email=${DEFAULT_USER_EMAIL:user@foodbev.com}
app.default.user.password=${DEFAULT_USER_PASSWORD:}