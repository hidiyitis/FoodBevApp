<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - FoodBev</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <style>
    /* Mengambil nilai dari variabel CSS kustom Anda */
    :root {
      --primary: #8B7355;
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
      --border-radius: 12px;
    }

    .card.shadow-lg {
      box-shadow: var(--shadow-lg) !important;
      border-radius: var(--border-radius);
    }

    .text-primary {
      color: var(--primary) !important;
    }

    .btn-primary {
      background-color: var(--primary);
      border-color: var(--primary);
    }
  </style>
</head>
<body class="bg-light">
<div class="container">
  <div class="row justify-content-center align-items-center min-vh-100">
    <div class="col-md-5 col-lg-4">
      <div class="text-center mb-4">
        <a th:href="@{/}" class="text-decoration-none text-muted">
          <i class="bi bi-arrow-left me-2"></i>Back to Home
        </a>
      </div>

      <div class="card shadow-lg border-0 rounded-lg">
        <div class="card-body p-4">
          <div class="text-center mb-4">
            <a th:href="@{/}" class="text-decoration-none">
              <i class="bi bi-cup-hot-fill display-6 text-primary"></i>
            </a>
            <h2 class="mt-3 fw-bold">Create Account</h2>
            <p class="text-muted">Join thousands of food businesses</p>
          </div>

          <form th:action="@{/auth/register}" method="post">
            <div class="mb-3">
              <label for="fullName" class="form-label">Full Name</label>
              <input type="text" class="form-control" id="fullName" name="fullName"
                     placeholder="Enter your full name" required>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email Address</label>
              <input type="email" class="form-control" id="email" name="email"
                     placeholder="Enter your email" required>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" name="password"
                     placeholder="Create a password" required>
              <div class="form-text">Use 8+ characters with a mix of letters, numbers & symbols</div>
            </div>

            <div class="mb-3">
              <label for="confirmPassword" class="form-label">Confirm Password</label>
              <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                     placeholder="Confirm your password" required>
            </div>

            <div class="mb-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" required id="terms">
                <label class="form-check-label" for="terms">
                  I agree to the <a href="#" class="text-primary text-decoration-none">Terms of Service</a> and <a href="#" class="text-primary text-decoration-none">Privacy Policy</a>
                </label>
              </div>
            </div>

            <button type="submit" class="btn btn-primary btn-md w-100 py-2 fw-semibold">Create Account</button>
          </form>

          <div class="text-center mt-4">
            <p class="text-muted">Already have an account?
              <a th:href="@{/auth/login}" class="text-decoration-none fw-bold text-primary">Sign in</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
