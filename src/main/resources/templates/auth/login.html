<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FoodBev</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <style>
    /* Mengambil nilai dari variabel CSS kustom Anda */
    :root {
      --primary: #8B7355;
      --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.12);
      --border-radius: 12px;
    }

    .card.shadow-lg {
      box-shadow: var(--shadow-lg) !important;
      border-radius: var(--border-radius);
    }

    .text-primary {
      color: var(--primary) !important;
    }

    .btn-primary {
      background-color: var(--primary);
      border-color: var(--primary);
    }
  </style>
</head>

<body class="bg-light">
  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-md-5 col-lg-4">
        <div class="text-center mb-4">
          <a th:href="@{/}" class="text-decoration-none text-muted">
            <i class="bi bi-arrow-left me-2"></i>Back to Home
          </a>
        </div>

        <div class="card shadow-lg border-0 rounded-lg">
          <div class="card-body p-4">
            <div class="text-center mb-4">
              <a th:href="@{/}" class="text-decoration-none">
                <i class="bi bi-cup-hot-fill display-6 text-primary"></i>
              </a>
              <h2 class="mt-3 fw-bold">Welcome Back</h2>
              <p class="text-muted">Sign in to your account</p>
            </div>

            <div th:if="${param.error}" class="alert alert-danger">
              <i class="bi bi-exclamation-triangle me-2"></i>Invalid username or password.
            </div>

            <div th:if="${param.logout}" class="alert alert-success">
              <i class="bi bi-check-circle me-2"></i>You have been logged out successfully.
            </div>

            <div th:if="${successMessage}" class="alert alert-success">
              <i class="bi bi-check-circle me-2"></i>
              <span th:text="${successMessage}"></span>
            </div>

            <form th:action="@{/auth/login}" method="post">
              <div class="mb-3">
                <label for="username" class="form-label">Email or Username</label>
                <input type="text" class="form-control" id="username" name="username"
                  placeholder="Enter your email or username" required>
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                  <input type="password" class="form-control" id="password" name="password"
                    placeholder="Enter your password" required>
                  <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('password')">
                    <i class="bi bi-eye" id="password-icon"></i>
                  </button>
                </div>
              </div>

              <button type="submit" class="btn btn-primary btn-md w-100 py-2 mb-3 fw-semibold">Sign In</button>
            </form>

            <div class="text-center mt-4">
              <p class="text-muted">Don't have an account?
                <a th:href="@{/auth/register}" class="text-decoration-none fw-bold text-primary">Sign up here</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Password Toggle Script -->
  <script>
    function togglePassword(fieldId) {
      var passwordInput = document.getElementById(fieldId);
      var icon = document.getElementById(fieldId + '-icon');

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
      } else {
        passwordInput.type = 'password';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
      }
    }
  </script>
</body>

</html>
