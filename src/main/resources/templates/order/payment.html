<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - FoodBev</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        :root {
            --primary: #8B7355;
            --primary-dark: #6B5B3D;
            --shadow-soft: 0 4px 12px rgba(0,0,0,0.08);
        }

        .payment-card {
            border-radius: 12px;
            box-shadow: var(--shadow-soft);
        }

        .coming-soon-box {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 12px;
            padding: 3rem;
            text-align: center;
        }

        .coming-soon-icon {
            font-size: 5rem;
            color: var(--primary);
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-cup-hot-fill me-2 text-primary"></i>FoodBev
        </a>
    </div>
</nav>

<div class="container py-5">
    
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <h3 class="fw-bold mb-4">
                <i class="bi bi-credit-card me-2"></i> Payment
            </h3>

            <!-- ORDER SUMMARY -->
            <div class="card payment-card border-0 mb-4">
                <div class="card-body">
                    <h5 class="fw-semibold mb-3">Order Summary</h5>
                    
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Order Number</span>
                        <span class="fw-semibold">#<span th:text="${order.id}">001</span></span>
                    </div>

                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Customer</span>
                        <span class="fw-semibold" th:text="${order.customerName}">John Doe</span>
                    </div>

                    <hr>

                    <div class="d-flex justify-content-between fs-5 fw-bold">
                        <span>Total Amount</span>
                        <span class="text-primary">
                            Rp <span th:text="${#numbers.formatInteger(order.totalAmount,0,'POINT')}">0</span>
                        </span>
                    </div>
                </div>
            </div>

            <!-- COMING SOON MESSAGE -->
            <div class="coming-soon-box">
                <div class="coming-soon-icon">
                    <i class="bi bi-tools"></i>
                </div>
                <h2 class="fw-bold mb-3">Payment Page Coming Soon</h2>
                <p class="text-muted mb-4">
                    We're working on integrating payment methods for your convenience. 
                    <br>This feature will be available soon!
                </p>
                <p class="text-muted small">
                    For now, please proceed with payment at the counter.
                </p>
            </div>

            <!-- BACK BUTTON -->
            <div class="text-center mt-4">
                <a th:href="@{'/user/order/confirmation/' + ${order.id}}" class="btn btn-outline-primary">
                    <i class="bi bi-arrow-left me-1"></i> Back to Order Details
                </a>
            </div>

        </div>
    </div>

</div>

</body>
</html>
