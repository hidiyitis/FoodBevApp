<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Detail - FoodBev</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        :root {
            --primary: #8B7355;
            --primary-dark: #6B5B3D;
            --shadow-soft: 0 4px 12px rgba(0,0,0,0.08);
        }

        .order-card {
            border-radius: 12px;
            box-shadow: var(--shadow-soft);
        }

        .order-type-card {
            border: 2px solid #dee2e6;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .order-type-card:hover {
            border-color: var(--primary);
            background-color: #f8f9fa;
        }

        .order-type-card.active {
            border-color: var(--primary);
            background-color: rgba(139, 115, 85, 0.1);
        }

        .order-type-card input[type="radio"] {
            display: none;
        }

        .order-summary-section {
            background: #f8f9fa;
            border-radius: 12px;
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-cup-hot-fill me-2 text-primary"></i>FoodBev
        </a>

        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/user/dashboard}">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/user/cart}">My Cart</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active fw-semibold">Order Detail</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-5">

    <!-- BACK BUTTON -->
    <div class="mb-3">
        <a th:href="@{/user/cart}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i> Back to Cart
        </a>
    </div>

    <h3 class="fw-bold mb-4">
        <i class="bi bi-clipboard-check me-2"></i> Order Detail
    </h3>

    <form th:action="@{/user/order/place}" method="post" onsubmit="return validateForm()">
        
        <div class="row">
            <!-- LEFT COLUMN -->
            <div class="col-lg-8">

                <!-- ORDER TYPE SELECTION -->
                <div class="card order-card border-0 mb-4">
                    <div class="card-body">
                        <h5 class="fw-semibold mb-3">
                            <i class="bi bi-shop me-2"></i> Order Type
                        </h5>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="order-type-card p-4 d-block text-center" id="dineInCard">
                                    <input type="radio" name="orderType" value="DINE_IN" required>
                                    <div class="mb-2">
                                        <i class="bi bi-house-door display-4 text-primary"></i>
                                    </div>
                                    <h5 class="fw-semibold mb-1">Dine In</h5>
                                    <small class="text-muted">Makan di tempat</small>
                                </label>
                            </div>

                            <div class="col-md-6">
                                <label class="order-type-card p-4 d-block text-center" id="takeawayCard">
                                    <input type="radio" name="orderType" value="TAKEAWAY" required>
                                    <div class="mb-2">
                                        <i class="bi bi-bag display-4 text-primary"></i>
                                    </div>
                                    <h5 class="fw-semibold mb-1">Takeaway</h5>
                                    <small class="text-muted">Bawa pulang</small>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- CUSTOMER INFORMATION -->
                <div class="card order-card border-0 mb-4">
                    <div class="card-body">
                        <h5 class="fw-semibold mb-3">
                            <i class="bi bi-person me-2"></i> Customer Information
                        </h5>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" name="customerName" 
                                       th:value="${user.name}" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Phone <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" name="customerPhone" 
                                       th:value="${user.phone}" required>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Email (Optional)</label>
                                <input type="email" class="form-control" name="customerEmail" 
                                       th:value="${user.email}">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- DINE IN DETAILS -->
                <div class="card order-card border-0 mb-4" id="dineInDetails" style="display: none;">
                    <div class="card-body">
                        <h5 class="fw-semibold mb-3">
                            <i class="bi bi-table me-2"></i> Dine In Details
                        </h5>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Table Number <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" name="tableNumber" min="1" id="tableNumberInput">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Number of People <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" name="numberOfPeople" min="1" id="numberOfPeopleInput">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- TAKEAWAY DETAILS -->
                <div class="card order-card border-0 mb-4" id="takeawayDetails" style="display: none;">
                    <div class="card-body">
                        <h5 class="fw-semibold mb-3">
                            <i class="bi bi-clock me-2"></i> Takeaway Details
                        </h5>

                        <div class="mb-3">
                            <label class="form-label">Pickup Time</label>
                            <select class="form-select" name="pickupTime" id="pickupTimeInput">
                                <option value="Now">Now (Sekarang)</option>
                                <option value="15 minutes">15 minutes</option>
                                <option value="30 minutes">30 minutes</option>
                                <option value="1 hour">1 hour</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- ORDER NOTES -->
                <div class="card order-card border-0 mb-4">
                    <div class="card-body">
                        <h5 class="fw-semibold mb-3">
                            <i class="bi bi-chat-left-text me-2"></i> Order Notes
                        </h5>

                        <textarea class="form-control" name="orderNotes" rows="3" 
                                  placeholder="Special requests, allergies, etc. (Optional)"></textarea>
                    </div>
                </div>

            </div>

            <!-- RIGHT COLUMN - ORDER SUMMARY -->
            <div class="col-lg-4">
                <div class="card order-card border-0 position-sticky" style="top: 100px;">
                    <div class="card-body">
                        <h5 class="fw-semibold mb-3">Order Summary</h5>

                        <!-- ITEMS LIST -->
                        <div class="order-summary-section p-3 mb-3">
                            <div class="mb-2" th:each="item : ${cartItems}">
                                <div class="d-flex justify-content-between align-items-start">
                                    <div class="flex-grow-1">
                                        <small class="fw-semibold" th:text="${item.product.name}">Product</small>
                                        <br>
                                        <small class="text-muted">x<span th:text="${item.quantity}">1</span></small>
                                    </div>
                                    <small class="fw-semibold">
                                        Rp <span th:text="${#numbers.formatInteger(item.product.calculatePrice() * item.quantity,0,'POINT')}">0</span>
                                    </small>
                                </div>
                            </div>
                        </div>

                        <!-- TOTALS -->
                        <div class="d-flex justify-content-between mb-2">
                            <span>Subtotal</span>
                            <span>
                                Rp <span th:text="${#numbers.formatInteger(subtotal,0,'POINT')}">0</span>
                            </span>
                        </div>

                        <div class="d-flex justify-content-between mb-2">
                            <span>Tax (10%)</span>
                            <span>
                                Rp <span th:text="${#numbers.formatInteger(tax,0,'POINT')}">0</span>
                            </span>
                        </div>

                        <hr>

                        <div class="d-flex justify-content-between fs-5 fw-bold mb-3">
                            <span>Total</span>
                            <span class="text-primary">
                                Rp <span th:text="${#numbers.formatInteger(grandTotal,0,'POINT')}">0</span>
                            </span>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 fw-semibold">
                            <i class="bi bi-check-circle me-1"></i> Place Order
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </form>

</div>

<script>
    // Order Type Selection
    const dineInCard = document.getElementById('dineInCard');
    const takeawayCard = document.getElementById('takeawayCard');
    const dineInDetails = document.getElementById('dineInDetails');
    const takeawayDetails = document.getElementById('takeawayDetails');
    const tableNumberInput = document.getElementById('tableNumberInput');
    const numberOfPeopleInput = document.getElementById('numberOfPeopleInput');
    const pickupTimeInput = document.getElementById('pickupTimeInput');

    // Handle Dine In selection
    dineInCard.addEventListener('click', function() {
        dineInCard.classList.add('active');
        takeawayCard.classList.remove('active');
        dineInDetails.style.display = 'block';
        takeawayDetails.style.display = 'none';
        tableNumberInput.required = true;
        numberOfPeopleInput.required = true;
        pickupTimeInput.required = false;
    });

    // Handle Takeaway selection
    takeawayCard.addEventListener('click', function() {
        takeawayCard.classList.add('active');
        dineInCard.classList.remove('active');
        takeawayDetails.style.display = 'block';
        dineInDetails.style.display = 'none';
        tableNumberInput.required = false;
        numberOfPeopleInput.required = false;
        pickupTimeInput.required = true;
    });

    // Form validation
    function validateForm() {
        const orderType = document.querySelector('input[name="orderType"]:checked');
        
        if (!orderType) {
            alert('Please select order type (Dine In or Takeaway)');
            return false;
        }

        const customerName = document.querySelector('input[name="customerName"]').value.trim();
        const customerPhone = document.querySelector('input[name="customerPhone"]').value.trim();

        if (!customerName || !customerPhone) {
            alert('Please fill in your name and phone number');
            return false;
        }

        if (orderType.value === 'DINE_IN') {
            const tableNumber = tableNumberInput.value;
            const numberOfPeople = numberOfPeopleInput.value;

            if (!tableNumber || !numberOfPeople) {
                alert('Please fill in table number and number of people for Dine In');
                return false;
            }
        }

        return confirm('Confirm your order?');
    }
</script>

</body>
</html>
